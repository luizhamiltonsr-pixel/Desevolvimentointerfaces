<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verificador de idade</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f1f6; margin: 0; padding: 30px; }
    main { max-width: 420px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    h1 { color: #43054e; margin-top: 0; }
    label { display: block; margin-bottom: 8px; }
    input { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 16px; padding: 12px; background: #662c92; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
    button:hover { background: #43054e; }
    #resultado { margin-top: 16px; font-weight: bold; min-height: 1.4em; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <h1>Verificador de idade</h1>
    <label for="idade">Informe sua idade:</label>
    <input id="idade" type="number" min="0" max="120" step="1">
    <button id="verificar" type="button">Verificar</button>
    <p id="resultado" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
