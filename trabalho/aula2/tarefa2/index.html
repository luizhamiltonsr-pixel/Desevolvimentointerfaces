<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora de média</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f1f6; margin: 0; padding: 30px; color: #1f1f1f; }
    .container { max-width: 420px; margin: 40px auto; background: #fff; padding: 28px; border-radius: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.1); }
    h1 { color: #43054e; margin-top: 0; }
    label { display: block; margin: 14px 0 6px; font-weight: bold; }
    input { width: 100%; padding: 10px; border: 1px solid #bbb; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #662c92; color: #fff; border: 0; border-radius: 6px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #43054e; }
    #resultado { margin-top: 18px; padding: 12px; border-radius: 6px; background: #f3f4f6; min-height: 1.4em; font-weight: bold; }
  </style>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Calculadora de média</h1>
    <label for="n1">Nota 1</label><input id="n1" type="number" min="0" max="10" step="0.1">
    <label for="n2">Nota 2</label><input id="n2" type="number" min="0" max="10" step="0.1">
    <label for="n3">Nota 3</label><input id="n3" type="number" min="0" max="10" step="0.1">
    <button id="calcular" type="button">Calcular</button>
    <p id="resultado" role="status" aria-live="polite"></p>
  </main>
</body>
</html>
